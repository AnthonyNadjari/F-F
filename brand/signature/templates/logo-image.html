<!-- ============================================================
     FINCK & FISCH — Signature email / Variante C "Logo image"
     Identique a la variante A, mais le monogramme est une image.
     A utiliser UNIQUEMENT quand le PNG est heberge en https sur un
     domaine stable (ex: https://finckfisch.fr/brand/monogram@2x.png).
     Regles : PNG (pas de SVG, Gmail le supprime), fond transparent,
     exporte en x2 (ex: 120x120) puis affiche en 60x60 via width/height.
     ============================================================ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td valign="top" style="padding:0 18px 0 0;">
      <img src="{{LOGO_URL}}" alt="Finck &amp; Fisch" width="56" height="56" style="display:block;width:56px;height:56px;border:0;outline:none;text-decoration:none;">
    </td>

    <td width="1" bgcolor="#DCD7D0" style="width:1px;min-width:1px;line-height:1px;font-size:1px;">&nbsp;</td>

    <td valign="top" style="padding:2px 0 0 18px;">
      <div style="font-family:Georgia,'Times New Roman',Times,serif;font-size:15px;line-height:20px;color:#111111;letter-spacing:1.6px;text-transform:uppercase;">{{NOM_COMPLET}}</div>
      <div style="font-size:12px;line-height:18px;color:#77716A;letter-spacing:0.4px;padding-top:3px;">{{ROLE}} &nbsp;&middot;&nbsp; Finck &amp; Fisch</div>
      <div style="font-size:12px;line-height:19px;padding-top:11px;">
        <a href="mailto:{{EMAIL}}" style="color:#111111;text-decoration:none;"><span style="color:#111111;text-decoration:none;">{{EMAIL}}</span></a><br>
        <a href="tel:{{TEL_BRUT}}" style="color:#111111;text-decoration:none;"><span style="color:#111111;text-decoration:none;">{{TELEPHONE}}</span></a><br>
        <a href="{{SITE_URL}}" style="color:#111111;text-decoration:none;"><span style="color:#111111;text-decoration:none;">{{SITE}}</span></a>
      </div>
      <div style="font-size:10px;line-height:14px;color:#A39C93;letter-spacing:2px;text-transform:uppercase;padding-top:12px;">Digital Studio</div>
    </td>
  </tr>
</table>
