<!-- ============================================================
     FINCK & FISCH — Signature email / Variante B "Compacte"
     Pour les reponses dans un fil deja long : 2 lignes, filet en tete.
     ============================================================ -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <!-- Filet horizontal -->
  <tr>
    <td height="1" bgcolor="#DCD7D0" style="height:1px;line-height:1px;font-size:1px;width:280px;">&nbsp;</td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0;">
      <div style="font-family:Georgia,'Times New Roman',Times,serif;font-size:13px;line-height:18px;color:#111111;letter-spacing:1.4px;text-transform:uppercase;">
        {{NOM_COMPLET}} &nbsp;&middot;&nbsp; Finck &amp; Fisch
      </div>
      <div style="font-size:11px;line-height:17px;color:#77716A;padding-top:4px;">
        <a href="mailto:{{EMAIL}}" style="color:#77716A;text-decoration:none;"><span style="color:#77716A;text-decoration:none;">{{EMAIL}}</span></a>
        &nbsp;&middot;&nbsp;
        <a href="tel:{{TEL_BRUT}}" style="color:#77716A;text-decoration:none;"><span style="color:#77716A;text-decoration:none;">{{TELEPHONE}}</span></a>
        &nbsp;&middot;&nbsp;
        <a href="{{SITE_URL}}" style="color:#77716A;text-decoration:none;"><span style="color:#77716A;text-decoration:none;">{{SITE}}</span></a>
      </div>
    </td>
  </tr>
</table>
